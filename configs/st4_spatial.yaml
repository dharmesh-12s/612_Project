# Ablation step 4: + spatial attention across the 16 nearest stations, learned distance penalty
name: st4_spatial
model:
  type: st_transformer
  d_model: 128
  n_heads: 8
  n_layers: 3
  d_ff: 256
  dropout: 0.1
  revin: true
  patch_len: 12
  time_emb: true
  station_emb: true
  spatial: true
  k_neighbors: 16
  pre_ln: true
  grad_checkpoint: true      # needed to fit the 5 GB GPU slice at batch 8
train:
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0001
  epochs: 40
  steps_per_epoch: 300
  patience: 6
  warmup_frac: 0.05
  val_stride: 24
  eval_stride: 1
  eval_batch: 8
  quantiles: [0.5]
